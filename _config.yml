# ---------------------------------------------------------------------------
# Site identity
# ---------------------------------------------------------------------------
title:    "Faruq Pradhan"
tagline:  "MB BCh BAO, FRCPC, LRCP&SI"
role:     "Transplant Hepatologist · Assistant Professor"  # shown under the site name
email:    "liver@fpradhan.com"
phone:    "402-559-5200"
lang:     "en"

description: >-
  Digital portfolio for the Master of Health Professions Teaching &
  Technology, University of Nebraska Medical Center.

url:     "https://fpradhan.com"
baseurl: ""

# Used by jekyll-seo-tag for the author and JSON-LD blocks.
author:
  name: "Faruq Pradhan"
social:
  name:  "Faruq Pradhan"
  links:
    - "https://www.linkedin.com/in/faruq-pradhan"
    - "https://scholar.google.com/citations?user=RCPGvYgAAAAJ&hl=en"

# ---------------------------------------------------------------------------
# Optional slots. Each renders only when you fill it in, so the site never
# shows a broken link or an empty box for something you have not supplied.
# ---------------------------------------------------------------------------

# Portrait for the About page, e.g. "/assets/img/portrait.jpg".
# Drop the file into assets/img/ and put its path here — the About page then
# switches to a two-column hero with the photograph beside the introduction.
# Any aspect ratio works; it is cropped to 4:5 with the top of the frame
# favoured, so a standard headshot sits correctly.
portrait: "/assets/img/portrait.jpg"
portrait_alt: "Faruq Pradhan"

# Social preview image used when a link to the site is shared, e.g.
# "/assets/img/social-card.png". 1200x630 works well. Leave empty to omit it.
image: ""

# Downloadable CV, e.g. "/assets/artifacts/pradhan-cv.pdf"
cv: "/assets/artifacts/pradhan-cv.pdf"
cv_label: "Download the full CV (PDF)"

# External profiles. Shown in the footer and on the Contact page.
# The same URLs are repeated under social.links above, which is what puts them
# in the page's structured data for Google.
profiles:
  - name: "LinkedIn"
    url:  "https://www.linkedin.com/in/faruq-pradhan"
  - name: "Google Scholar"
    url:  "https://scholar.google.com/citations?user=RCPGvYgAAAAJ&hl=en"

# Contact form. GitHub Pages serves static files and cannot process a form
# POST, so delivery needs an external handler. Nothing appears on /contact/
# until `form_endpoint` is filled in — the email address is shown instead, so
# the page is never broken.
#
# Web3Forms (no account; they email you an access key at the address you want
# the mail delivered to — put liver@fpradhan.com in):
#   form_provider: "web3forms"
#   form_endpoint: "https://api.web3forms.com/submit"
#   form_access_key: "the key they send you"
#
# Formspree (account required; create a form, set its recipient, copy the URL):
#   form_provider: "formspree"
#   form_endpoint: "https://formspree.io/f/xxxxxxxx"
#   form_access_key: ""            # not used
form_provider: "web3forms"
form_endpoint: "https://api.web3forms.com/submit"
form_access_key: "bc71f164-db2b-40bb-a758-27cbcaacb8eb"

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
collections:
  competencies:
    output: true
    permalink: /artifacts/:name/

defaults:
  - scope: { path: "" }
    values: { layout: "page" }
  - scope: { path: "", type: "competencies" }
    values: { layout: "competency" }

# The github-pages gem defaults `theme` to jekyll-theme-primer. That theme ships its own
# assets/css/style.scss, which compiles to the same /assets/css/style.css this site already
# provides — so the two collide. This site supplies all of its own layouts, includes and
# styling, so the theme is switched off explicitly.
theme: null

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter_opts:
    disable: true

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .gitignore
  - assets/artifacts/README.md
  - notes
