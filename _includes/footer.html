<footer class="site-footer">
  <div class="wrap footer-inner">
    <div>
      <p class="footer-name">{{ site.title }}</p>
      <p class="footer-meta">{{ site.tagline }}</p>
    </div>
    <div class="footer-contact">
      <p><a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
      <p>{{ site.phone }}</p>
    </div>
  </div>
</footer>
